<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Garmin Uzbekistan</title>
<meta name="theme-color" content="#000">
<link rel="preconnect" href="https://ugc.production.linktr.ee" crossorigin>
<link rel="preload" as="image" href="img/hero.webp" fetchpriority="high">
<style>
*{box-sizing:border-box;margin:0}
html{background:#141414;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font-family:Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;justify-content:center}
.page{width:100%;max-width:460px;background:#000;position:relative;padding-bottom:40px}
.bar{display:contents}
.act{display:flex;gap:14px;justify-content:center;margin:18px 0 26px}
@media(min-width:520px){.page{margin:32px 0;border-radius:32px;overflow:clip}}
.hero{position:relative;height:420px;background:#000;overflow:hidden}
.hero>img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transform-origin:50% 28%;transform:translateY(var(--py,0px)) scale(1.28);opacity:var(--po,1);will-change:transform,opacity}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to bottom,transparent,#000 92%)}
.id{margin-top:-96px;position:relative;z-index:2;text-align:center;padding:0 24px}
.id img{width:240px;height:auto;display:block;margin:0 auto 14px}
.id p{font-size:13.5px;font-weight:500;line-height:1.35}
.soc{display:flex;gap:20px;justify-content:center;margin:18px 0 26px}
.soc a{color:#fff;display:block;width:28px;height:28px}
.soc svg{width:100%;height:100%;fill:currentColor}
.list{padding:0 24px;display:grid;gap:12px}
.card{display:block;text-decoration:none;color:#fff;background:#3a3a3a;border-radius:22px;padding:12px 12px 0;border:1px solid #4a4a4a;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .15s}
.card:active{transform:scale(.98)}
.card .ph{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card span{display:block;text-align:center;font-weight:700;font-size:13px;letter-spacing:.2px;padding:21px 8px 20px;text-transform:uppercase}
footer{text-align:center;font-size:12px;color:#999;margin-top:28px}
.id img{cursor:pointer}
.logo{position:relative;width:240px;margin:0 auto 14px}
.logo>img{margin:0;cursor:pointer}
.pop{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,8px) scale(.9);transform-origin:50% 100%;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;padding:9px 22px;border-radius:20px;background:rgba(60,60,60,.7);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 6px 20px rgba(0,0,0,.45);color:#fff;font:700 14px Roboto,sans-serif;text-decoration:none;white-space:nowrap}
.pop::after{content:"";position:absolute;left:50%;top:100%;width:16px;height:8px;margin-left:-8px;background:rgba(60,60,60,.7);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);clip-path:polygon(0 0,100% 0,50% 100%)}
.pop.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.nav{position:sticky;top:16px;z-index:20;width:fit-content;margin:16px 0 -54px 16px;display:flex;padding:3px;border-radius:20px;background:rgba(60,60,60,.7);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4)}
.nav button{border:0;background:none;color:#fff;font:700 13px Roboto,sans-serif;padding:0 14px;height:32px;border-radius:16px;cursor:pointer;transition:background .15s,color .15s}
.nav button.on{background:rgba(255,255,255,.9);color:#000}
.tel{flex:1;max-width:190px;height:54px;border-radius:27px;gap:10px;padding:0 16px;text-decoration:none;font:700 15px Roboto,sans-serif;white-space:nowrap;background:rgba(60,60,60,.7);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.tel:active{transform:scale(.94)}
.tel svg{width:24px;height:24px;flex:none;fill:currentColor}
.soc.bot{margin:34px 0 0}
@keyframes heroOut{to{opacity:0;transform:translateY(-84px) scale(1.28)}}
@keyframes heroFade{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(32px) scale(.96)}}
@supports (animation-timeline:scroll()){
.hero>img{animation:heroOut linear both;animation-timeline:scroll(root);animation-range:0 380px}
.card{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 40%}
@media (prefers-reduced-motion:reduce){.hero>img{animation-name:heroFade}.card{animation:none}}
}
</style>
</head>
<body>
<main class="page">
  <div class="bar">
    <div class="nav" role="group" aria-label="Language"><button data-l="uz">UZ</button><button data-l="en">EN</button><button data-l="ru">RU</button></div>
  </div>
  <header class="hero">
    
    <img src="img/hero.webp" alt="" width="460" height="420" fetchpriority="high" decoding="async">
  </header>
  <section class="id">
    <div class="logo"><a class="pop" id="pop" href="https://www.garmin.com/" target="_blank" rel="noopener">Open</a><img src="https://ugc.production.linktr.ee/82c811cc-95c5-490f-9642-d661b73e3143_Garmin-Logo-Without-Delta-white-high-res.png" alt="Garmin" width="240" height="48"></div>
    <p id="tag">Engineered on the inside for life on the outside.</p>
    <div class="act"><a class="tel" href="https://t.me/garminofficialuzbot" target="_blank" rel="noopener" aria-label="Contact us on Telegram"><svg viewBox="0 0 24 24"><path d="M21.6 3.2 2.5 10.600c-1.300.5-1.300 1.300-.2 1.600l4.900 1.500 1.900 5.800c.2.700.4.900.9.900.4 0 .6-.2.9-.5l2.300-2.200 4.800 3.500c.9.500 1.500.2 1.700-.8l3-14.500c.3-1.200-.4-1.800-1.100-1.500zM9.100 13.100l9.600-6c.5-.3.9-.1.5.2l-7.800 7-.3 3.300z"/></svg><span id="l-tg">Message us</span></a>
    <a class="tel" href="tel:+998701203333" aria-label="Call +998 70 120 33 33"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.250.2 2.450.57 3.570a1 1 0 0 1-.25 1z"/></svg><span id="l-call">Call us</span></a>
    </div>
  </section>
  <section class="list" id="list"></section>
    <nav class="soc bot">
      <a href="https://t.me/GarminUz" target="_blank" rel="noopener" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg></a>
      <a href="https://www.facebook.com/garmin.com.uz/?ref=NONE_xav_ig_profile_page_web" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg></a>
      <a href="https://www.instagram.com/garmin.uz/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.6" cy="6.4" r="1.4"/></svg></a>
      <a href="https://www.google.com/search?client=safari&sca_esv=594589735&hl=en-uz&q=Garmin+Uzbekistan&ludocid=16043527555344378827&lsig=AB86z5UY1qk6kSI_dpf4eOuJA1nh&kgs=6a2ad0410581ee02&shndl=-1&shem=lcspc,lsp&source=sh/x/loc/act/m1/3" target="_blank" rel="noopener" aria-label="Business profile"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 .8a9.200 9.200 0 0 0-9.200 9.200c0 6.300 9.200 13.200 9.200 13.200s9.200-6.900 9.200-13.200A9.200 9.200 0 0 0 12 .8zm0 12.700a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></a>
    </nav>
  <footer id="foot">Cookie Preferences · Report · Privacy</footer>
</main>

<script>
(()=>{const h=document.querySelector(".hero>img");if(!h||CSS.supports("animation-timeline:scroll()"))return;let t=0;
const f=()=>{t=0;const y=Math.min(scrollY,420);h.style.setProperty("--py",(-y*.22)+"px");h.style.setProperty("--po",Math.max(0,1-y/380).toFixed(3))};
addEventListener("scroll",()=>{t||(t=requestAnimationFrame(f))},{passive:true});f()})();
const pop=document.getElementById("pop"),shut=()=>pop.classList.remove("open");
document.querySelector(".logo>img").addEventListener("click",e=>{e.stopPropagation();pop.classList.toggle("open")});
pop.addEventListener("click",shut);
addEventListener("click",shut);
addEventListener("keydown",e=>{if(e.key==="Escape")shut()});

const U="https://ugc.production.linktr.ee/",G="https://www.garmin.com/en-US/c/",Q="?io=true&size=thumbnail-feature-v1_0";
const items=[
["Smartwatches","https://garmin.com.uz/catalog?category=fitness","img/smart.webp"],
["Health & Fitness Tracking","https://garmin.com.uz/catalog?category=fitness","img/health.webp"],
["Sports & Fitness","https://garmin.com.uz/catalog?category=fitness","img/sports.webp"],
["Marine","https://garmin.com.uz/catalog?category=marine","img/marine.webp"],
["Cycling","https://garmin.com.uz/catalog?category=cycling","img/cycling.webp"],
["Golf","https://garmin.com.uz/catalog?category=golf","img/golf.webp"]
];
const T={
en:{tg:"Message us",call:"Call us",title:"Garmin Uzbekistan",tag:"Engineered on the inside for life on the outside.",open:"Open",foot:"Cookie Preferences · Report · Privacy"},
uz:{tg:"Telegramda yozish",call:"Qo'ng'iroq",title:"Garmin O'zbekiston",tag:"Ichkarida muhandislik, tashqarida hayot uchun.",open:"Ochish",foot:"Cookie sozlamalari · Xabar berish · Maxfiylik"},
ru:{tg:"Написать нам",call:"Позвонить",title:"Garmin Узбекистан",tag:"Технологии внутри — для жизни снаружи.",open:"Открыть",foot:"Настройки cookie · Пожаловаться · Конфиденциальность"}};
const N=[
["Smartwatches","Smart-soatlar","Смарт-часы"],
["Health & Fitness Tracking","Salomatlik va fitnes treklari","Здоровье и фитнес-трекеры"],
["Sports & Fitness","Sport va fitnes","Спорт и фитнес"],
["Marine","Dengiz uchun","Морская электроника"],
["Cycling","Velosport","Велоспорт"],
["Golf","Golf","Гольф"]];
const L={en:0,uz:1,ru:2};
document.getElementById("list").innerHTML=items.map((it,i)=>
`<a class="card" href="${it[1].startsWith('http')?it[1]:G+it[1]}" target="_blank" rel="noopener"><div class="ph"><img src="${it[2].startsWith('img/')?it[2]:U+it[2]+Q}" alt="" width="400" height="225" decoding="async" ${i<2?'fetchpriority="high"':'loading="lazy"'}></div><span></span></a>`).join("");
const spans=[...document.querySelectorAll(".card span")];
function setLang(l){
  document.documentElement.lang=l;
  document.title=T[l].title;
  document.getElementById("l-tg").textContent=T[l].tg;
  document.getElementById("l-call").textContent=T[l].call;
  document.getElementById("tag").textContent=T[l].tag;
  document.getElementById("pop").textContent=T[l].open;
  document.getElementById("foot").textContent=T[l].foot;
  spans.forEach((sp,i)=>sp.textContent=N[i][L[l]]);
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setLang(b.dataset.l)});
let start="en";
try{start=localStorage.getItem("lang")||""}catch(e){}
if(!T[start]){const n=(navigator.language||"").slice(0,2);start=T[n]?n:"en"}
setLang(start);
</script>
</body>
</html>
