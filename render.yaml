# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys two services from this one repo:
#   - garmin-webapp : the customer-facing catalog/quiz/comparison site (static)
#   - garmin-ai-bot : the Telegram bot behind it (Node web service)
#
# Secrets marked `sync: false` are NOT stored in this file. Render prompts for
# them once when the Blueprint is first applied, and you can edit them later
# under Dashboard -> service -> Environment.

services:
  # ---------------------------------------------------------------------
  # Web app — static files, no build step, served from Render's CDN.
  # Unlike the bot, a static site never sleeps — no idle spin-down to work around.
  # ---------------------------------------------------------------------
  - type: web
    name: garmin-webapp
    runtime: static
    # Static sites have no instance plan — hosting is free by default and
    # billed by bandwidth, not compute. `plan` only applies to services with a
    # real runtime (node, docker, etc.) like garmin-ai-bot below.
    branch: main
    # rootDir scopes both the auto-deploy trigger (only redeploys on changes
    # under web/) and staticPublishPath, which is relative to it below.
    rootDir: web
    staticPublishPath: .
    autoDeployTrigger: commit

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      # cleanUrls equivalent: index.html serves both "/" and any unknown path,
      # since this is a single-page app with in-page anchors, not real routes.
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------
  # Telegram bot — Node web service behind a webhook.
  # ---------------------------------------------------------------------
  - type: web
    name: garmin-ai-bot
    runtime: node
    plan: free
    # Frankfurt is the lowest-latency free region for Uzbekistan.
    region: frankfurt
    branch: main
    # Only the bot/ folder is built and run; web/ is ignored at runtime but is
    # still checked out, which is what `npm run build` reads the catalog from.
    rootDir: bot
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Replaces the deprecated `autoDeploy: true`.
    autoDeployTrigger: commit

    envVars:
      # Major only, so Render picks the current patch of the LTS line.
      - key: NODE_VERSION
        value: "24"

      # --- Telegram ---------------------------------------------------------
      # Bot token from @BotFather.
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: garminofficialuzbot
      # Chat id that receives lead alerts.
      - key: MANAGER_CHAT_ID
        sync: false
      # Random 256-bit value Render generates; Telegram echoes it back in
      # X-Telegram-Bot-Api-Secret-Token so forged webhook posts are rejected.
      - key: WEBHOOK_SECRET
        generateValue: true

      # --- DeepSeek ---------------------------------------------------------
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_TEMPERATURE
        value: "0.4"
      - key: DEEPSEEK_MAX_TOKENS
        value: "900"

      # --- Runtime ----------------------------------------------------------
      - key: BOT_MODE
        value: webhook
      # PUBLIC_URL is left unset on purpose: the app falls back to
      # RENDER_EXTERNAL_URL, which Render injects automatically.
      # Free instances sleep after 15 min idle and cost ~1 min to wake, so the
      # app pings its own /healthz to stay warm.
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_MINUTES
        value: "12"

      # --- Business links ---------------------------------------------------
      # Update this once the static site's real onrender.com URL (or custom
      # domain) is known — Render assigns it at first deploy.
      - key: WEBAPP_URL
        value: https://garmin-webapp.onrender.com
      - key: SITE_URL
        value: https://www.garmin.com.uz
      - key: CATALOG_URL
        value: https://www.garmin.com.uz/catalog
      # Public store number — fine to expose in buttons/links.
      - key: CONTACT_PHONE
        value: "+998701203333"
      # Manager's direct line — spoken as text only on explicit /manager, never
      # in a button. Set this in the dashboard once known; falls back to
      # CONTACT_PHONE until then.
      - key: MANAGER_PHONE
        sync: false
      - key: HUMAN_TELEGRAM_URL
        value: https://t.me/garmin_uz
